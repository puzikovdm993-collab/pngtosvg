<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNG to SVG Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>PNG to SVG Converter</h1>
        <p class="description">Конвертируйте ваши PNG изображения в SVG формат прямо в браузере</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <p>Перетащите PNG файл сюда или кликните для выбора</p>
            <input type="file" id="fileInput" accept=".png,image/png" hidden>
        </div>

        <div class="preview-container" id="previewContainer" style="display: none;">
            <div class="preview-section">
                <h3>Оригинал (PNG)</h3>
                <img id="originalImage" alt="Original PNG">
            </div>
            
            <div class="preview-section">
                <h3>Результат (SVG)</h3>
                <div id="svgPreview"></div>
            </div>
        </div>

        <div class="controls" id="controls" style="display: none;">
            <div class="control-group">
                <label for="threshold">Порог яркости: <span id="thresholdValue">128</span></label>
                <input type="range" id="threshold" min="0" max="255" value="128">
            </div>
            
            <div class="control-group">
                <label for="scale">Масштаб: <span id="scaleValue">1</span></label>
                <input type="range" id="scale" min="0.5" max="4" step="0.5" value="1">
            </div>

            <button id="convertBtn" class="btn-primary">Конвертировать</button>
            <button id="downloadBtn" class="btn-success" disabled>Скачать SVG</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
